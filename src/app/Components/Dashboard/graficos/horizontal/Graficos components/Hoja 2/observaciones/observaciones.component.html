<div class="rounded-2xl border border-border bg-surface p-4 shadow-sm">
  <p-table
    [value]="displayedData"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} - {last} de {totalRecords} registros"
    [tableStyle]="{ 'min-width': '900px' }"
    [rowHover]="true"
    styleClass="tabla-header-primary p-datatable-sm"
  >
    <!-- Título -->
    <ng-template pTemplate="caption">
      <div class="flex items-center justify-between">
        <span class="text-lg font-extrabold uppercase tracking-wide text-ink">
          Observaciones
        </span>
      </div>
    </ng-template>

    <!-- Header -->
    <ng-template pTemplate="header">
      <tr>
        <th class="whitespace-nowrap text-left">Operador</th>
        <th class="whitespace-nowrap text-left">Equipo</th>
        <th class="whitespace-nowrap text-left">Labor</th>
        <th class="text-left">Observaciones</th>
      </tr>
    </ng-template>

    <!-- Body -->
    <ng-template pTemplate="body" let-item>
      <tr>
        <td class="whitespace-nowrap">
          {{ item.operador }}
        </td>

        <td class="whitespace-nowrap">
          {{ item.equipo }}
        </td>

        <td class="whitespace-nowrap">
          {{ item.labor }}
        </td>

        <td class="min-w-70 max-w-130 whitespace-normal wrap-break-word text-sm leading-relaxed">
          {{ item.observacion }}
        </td>
      </tr>
    </ng-template>

    <!-- Sin datos -->
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="py-8 text-center text-sm text-gray-500">
          No hay observaciones registradas.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
