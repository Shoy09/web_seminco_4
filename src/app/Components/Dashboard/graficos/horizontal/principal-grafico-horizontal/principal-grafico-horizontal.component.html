<app-dashboard-filtros
  [tiposFiltro]="tiposFiltro"
  [tipoFiltro]="tipoFiltro"
  [anioSeleccionado]="anioSeleccionado"
  [mesSeleccionado]="mesSeleccionado"
  [semanaSeleccionada]="semanaSeleccionada"
  [diaSeleccionado]="diaSeleccionado"
  [rangoFechas]="rangoFechas"
  [turnoSeleccionado]="turnoSeleccionado"
  [mostrarPresentacion]="true"
  [mostrarPdf]="true"
  [mostrarVista]="true"
  [vistaPrincipal]="vistaPrincipal"
  etiquetaVistaPrincipal="Graficos"
  (aplicar)="aplicarFiltrosDashboard($event)"
  (quitar)="quitarFiltro()"
  (presentacion)="Presentacion()"
  (pdf)="generarPDF()"
  (toggleVista)="toggleVista()"
/>

<div
  *ngIf="vistaPrincipal"
  class="grid grid-cols-1 gap-4 md:grid-cols-6 xl:grid-cols-12"
>
  <!-- RESUMEN: ancho completo -->
  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-resumen class="block w-full" [data]="resumen"> </app-resumen>
  </div>

  <!-- DISPAROS POR EQUIPO -->
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-disparos-equipo class="block w-full" [data]="dataDisparosEquipo">
    </app-disparos-equipo>
  </div>
  <!-- RENDIMIENTO POR EQUIPO -->
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-rendimiento-equipo class="block w-full" [data]="dataRendimientoEquipo">
    </app-rendimiento-equipo>
  </div>
  <!-- DISPAROS POR DÍA -->
  <div class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">

    <app-disparos-dia class="block w-full" [data]="dataDisparosDia">
    </app-disparos-dia>
  </div>

  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-grafica-pareto
      class="block w-full"
      [data]="DataParetoHorasOperativas"
      titulo="PARETO DE HORAS OPERATIVAS"
    >
    </app-grafica-pareto>
  </div>

  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-grafica-pareto
      class="block w-full"
      [data]="DataParetoHorasNoOperativas"
      titulo="PARETO DE HORAS NO OPERATIVAS"
      data-page="1"
    >
    </app-grafica-pareto>
  </div>


  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-grafica-pareto
      class="block w-full"
      [data]="DataParetoHorasMantenimiento"
      titulo="PARETO DE HORAS DE MANTENIMIENTO"
      data-page="1"
    >
    </app-grafica-pareto>
  </div>

  <!-- METROS PERFORADOS / DISPARO -->
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-metros-perforados-disparo
      class="block w-full"
      [data]="dataMetrosDisparoFR"
      data-page="1"
    >
    </app-metros-perforados-disparo>
  </div>

  <!-- PERFORADO POR EQUIPO -->
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-perforado-equipo class="block w-full" [data]="dataPerforadoEquipo">
    </app-perforado-equipo>
  </div>

  <!-- MHR POR EQUIPO -->
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-mhr-equipo class="block w-full" [data]="dataMhrEquipo">
    </app-mhr-equipo>
  </div>

  <!-- HORÓMETROS JUMBOS -->
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-horometros-equipo class="block w-full" [data]="dataHorometrosJumbos">
    </app-horometros-equipo>
  </div>

  <!-- TOTAL HORÓMETROS -->
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-total-horometros class="block w-full" [data]="dataHorometrosJumbos">
    </app-total-horometros>
  </div>

  <!-- HORAS PRIMERA PERFORACIÓN -->
  <div
    class="col-span-1 md:col-span-6 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-horas-primera-perforacion
      class="block w-full"
      [data]="dataProcesoLaborFR"
    >
    </app-horas-primera-perforacion>
  </div>
  <!-- AVANCE POR FASE -->
  <!-- <div
    class="col-span-1 md:col-span-6 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-avance-fase class="block w-full" [data]="dataAvanceFase">
    </app-avance-fase>
`  </div> -->

  <!-- DISPAROS TIPO PERFORACIÓN -->
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-disparos-tipo-perforacion
      class="block w-full"
      [data]="dataTipoPerforacion"
    >
    </app-disparos-tipo-perforacion>
  </div>

  <!-- PROMEDIO ESTADOS -->
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-promedio-estados-echarts
      class="block w-full"
      [data]="datosGraficoEstados"
      data-page="2"
    >
    </app-promedio-estados-echarts>
  </div>

  <!-- DETALLE PERFORACIÓN: ancho completo -->
  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-detalle-perforacion
      class="block w-full"
      [data]="dataPercusionConMetrosJumbos"
    >
    </app-detalle-perforacion>
  </div>

  <!-- DETALLE DISPAROS: ancho completo -->
  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-detalle-disparos class="block w-full" [data]="datadetalleDisparos">
    </app-detalle-disparos>
  </div>

  <!-- MEJORES OPERADORES: ancho completo -->
  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-mejores-operadores
      class="block w-full"
      [data]="dataFrPorOperadorTurno"
    >
    </app-mejores-operadores>
  </div>

  <!-- RANKING OPERADOR -->
  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-ranking-operador class="block w-full" [data]="dataFrPorOperadorTurno">
    </app-ranking-operador>
  </div>

  <!-- OBSERVACIONES: ancho completo -->
  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-observaciones class="block w-full" [data]="dataLaborFRDetallado">
    </app-observaciones>
  </div>

  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-mapa-de-calor
      class="block w-full"
      [data]="dataHorasNumericas"
      [turno]="turnoAplicado"
    >
    </app-mapa-de-calor>
  </div>
</div>

<div class="graficos-container" *ngIf="!vistaPrincipal">
  <app-scheduler
    class="full-width"
    [data]="ganttData"
    data-page="6"
  ></app-scheduler>
</div>

<div class="overlay" *ngIf="cargandoPDF">
  <div class="spinner"></div>
  <p>Generando PDF...</p>
</div>
