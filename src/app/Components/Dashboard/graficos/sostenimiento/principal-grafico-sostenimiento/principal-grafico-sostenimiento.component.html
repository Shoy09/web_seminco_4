<app-dashboard-filtros
  [tiposFiltro]="tiposFiltro"
  [mostrarPresentacion]="true"
  [mostrarPdf]="true"
  (aplicar)="aplicarFiltro($event)"
  (quitar)="quitarFiltro()"
  (presentacion)="Presentacion()"
  (pdf)="generarPDF()"
/>
<div
  *ngIf="vistaPrincipal"
  class="grid grid-cols-1 gap-4 md:grid-cols-6 xl:grid-cols-12"
>
  <!-- Hoja 1 pdf -->
  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-resumen [data]="resumen" />
  </div>
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-pernos-equipo [data]="DataPernosPorEquipo" />
  </div>

  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-pernos-dia [data]="DataPernoDia" />
  </div>
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-pernos-labor [data]="DataPernosPorLabor" />
  </div>
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-pernos-instalados-tipo
      [data]="DataPernosInstalados"
    />
  </div>
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-rendimiento-equipo [data]="DataDMyUTI" />
  </div>
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-mhr-equipo [data]="dataMHREquipo" />
  </div>

  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-perforado-equipo [data]="dataMetrosEquipo" />
  </div>

  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-horometros-equipo [data]="dataHorometrosEquipo" />
  </div>

  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-total-horometros [data]="dataHorometroGeneral" />
  </div>

  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-grafica-pareto
      [data]="DataEstadosSOS"
      [titulo]="'PARETO - HORAS OPERATIVAS'"
    />
  </div>

  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-grafica-pareto
      [data]="dataDemoraIno"
      [titulo]="'PARETO - HORAS NO OPERATIVAS'"
    />
  </div>

  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-grafica-pareto
      [data]="dataHoraMantenimiento"
      [titulo]="'PARETO - HORAS DE MANTENIMIENTO'"
    />
  </div>

 <!--  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-pernos-minado-tipo
      [data]="dataPernosMinadoTipo"
    ></app-pernos-minado-tipo>
  </div> -->

  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-horas-primera-perforacion [data]="dataProcesoLaborFR" />
  </div>

  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-detalle-equipo [data]="DataDetalleEquipo" />
  </div>

  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-detalle-sostenimiento
      [data]="DataDetalleSostenimiento"
    ></app-detalle-sostenimiento>
  </div>
  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-mejores-operadores [data]="dataFrPorOperadorTurno" />
  </div>
  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-ranking-operador [data]="dataFrPorOperadorTurno" />
  </div>
  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-observaciones [data]="dataLaborFRDetallado" />
  </div>

  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-mapa-de-calor [data]="dataMapaCalor" [turno]="turnoAplicado" />
  </div>
</div>

<div class="graficos-container" *ngIf="!vistaPrincipal">
  <app-scheduler [data]="ganttData" data-page="6"></app-scheduler>
</div>

<div class="overlay" *ngIf="cargandoPDF">
  <div class="spinner"></div>
  <p>Generando PDF...</p>
</div>
