<app-dashboard-filtros
  [tiposFiltro]="tiposFiltro"
  [mostrarPresentacion]="true"
  [mostrarPdf]="true"
  (aplicar)="aplicarFiltro($event)"
  (quitar)="quitarFiltro()"
  (presentacion)="Presentacion()"
  (pdf)="generarPDF()"
/>

<div
  *ngIf="vistaPrincipal"
  class="grid grid-cols-1 gap-4 md:grid-cols-6 xl:grid-cols-12"
>
  <!-- RESUMEN -->
  <div class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-resumen class="block w-full" [data]="resumen" data-page="1"></app-resumen>
  </div>

  <!-- DISPAROS POR EQUIPO -->
  <div class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-disparos-equipo class="block w-full" [data]="dataDisparosEquipo" data-page="1"></app-disparos-equipo>
  </div>

  <!-- RENDIMIENTO POR EQUIPO -->
  <div class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-rendimiento-equipo class="block w-full" [data]="dataRendimientoEquipo" data-page="1"></app-rendimiento-equipo>
  </div>

  <!-- PERFORADO POR EQUIPO -->
  <div class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-perforado-equipo class="block w-full" [data]="dataPerforadoEquipo" data-page="1"></app-perforado-equipo>
  </div>

  <!-- DISPAROS POR DÍA -->
  <div class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-disparos-dia class="block w-full" [data]="dataDisparosDia" data-page="1"></app-disparos-dia>
  </div>

  <!-- PARETO HORAS OPERATIVAS -->
  <div class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-grafica-pareto class="block w-full" [data]="dataParetoHorasOperativas" titulo="PARETO DE HORAS OPERATIVAS" data-page="2"></app-grafica-pareto>
  </div>

  <!-- PARETO HORAS NO OPERATIVAS -->
  <div class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-grafica-pareto class="block w-full" [data]="dataParetoHorasNoOperativas" titulo="PARETO DE HORAS NO OPERATIVAS" data-page="2"></app-grafica-pareto>
  </div>

  <!-- PARETO HORAS MANTENIMIENTO -->
  <div class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-grafica-pareto class="block w-full" [data]="dataParetoHorasMantenimiento" titulo="PARETO DE HORAS DE MANTENIMIENTO" data-page="2"></app-grafica-pareto>
  </div>

  <!-- MHR POR EQUIPO -->
  <div class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-mhr-equipo class="block w-full" [data]="dataMhrEquipo" data-page="2"></app-mhr-equipo>
  </div>

  <!-- HORÓMETROS POR EQUIPO -->
  <div class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-horometros-equipo class="block w-full" [data]="dataHorometrosJumbos" data-page="2"></app-horometros-equipo>
  </div>

  <!-- TOTAL HORÓMETROS -->
  <div class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-total-horometros class="block w-full" [data]="dataHorometrosJumbos" data-page="2"></app-total-horometros>
  </div>

  <!-- HORA PRIMERA PERFORACIÓN -->
  <div class="col-span-1 md:col-span-6 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-horas-primera-perforacion class="block w-full" [data]="dataProcesoLaborFR" data-page="3"></app-horas-primera-perforacion>
  </div>

  <!-- AVANCE POR FASE -->
  <div class="col-span-1 md:col-span-6 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-avance-fase class="block w-full" [data]="dataAvanceFase" data-page="3"></app-avance-fase>
  </div>

  <!-- DETALLE PERFORACIÓN -->
  <div class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-detalle-perforacion class="block w-full" [data]="dataPercusionConMetrosJumbos" data-page="4"></app-detalle-perforacion>
  </div>

  <!-- DETALLE DISPAROS -->
  <div class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-detalle-disparos class="block w-full" [data]="datadetalleDisparos" data-page="4"></app-detalle-disparos>
  </div>

  <!-- MEJORES OPERADORES -->
  <div class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-mejores-operadores class="block w-full" [data]="dataFrPorOperadorTurno" data-page="5"></app-mejores-operadores>
  </div>

  <!-- RANKING OPERADOR -->
  <div class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-ranking-operador class="block w-full" [data]="dataFrPorOperadorTurno" data-page="5"></app-ranking-operador>
  </div>

  <!-- OBSERVACIONES -->
  <div class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-observaciones class="block w-full" [data]="dataLaborFRDetallado" data-page="5"></app-observaciones>
  </div>

  <!-- MAPA DE CALOR -->
  <div class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm">
    <app-mapa-de-calor class="block w-full" [data]="dataHorasNumericas" [turno]="turnoAplicado" data-page="6"></app-mapa-de-calor>
  </div>
</div>

<div *ngIf="!vistaPrincipal">
  <app-scheduler class="block w-full" [data]="ganttData" data-page="6"></app-scheduler>
</div>

<div class="overlay" *ngIf="cargandoPDF">
  <div class="spinner"></div>
  <p>Generando PDF...</p>
</div>
