<app-dashboard-filtros
  [tiposFiltro]="tiposFiltro"
  [tipoFiltro]="tipoFiltro"
  [anioSeleccionado]="anioSeleccionado"
  [mesSeleccionado]="mesSeleccionado"
  [semanaSeleccionada]="semanaSeleccionada"
  [diaSeleccionado]="diaSeleccionado"
  [rangoFechas]="rangoFechas"
  [turnoSeleccionado]="turnoSeleccionado"
  [mostrarPresentacion]="true"
  [mostrarPdf]="true"
  (aplicar)="aplicarFiltrosDashboard($event)"
  (quitar)="quitarFiltro()"
  (presentacion)="Presentacion()"
  (pdf)="generarPDF()"
/>

<div
  *ngIf="vistaPrincipal"
  class="grid grid-cols-1 gap-4 md:grid-cols-6 xl:grid-cols-12"
>
  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-resumen class="block w-full" [data]="resumen"></app-resumen>
  </div>

  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-rendimiento-equipo [data]="dataDmUtiPorEquipoReutilizable" />
  </div>

  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-grafica-pareto
      [data]="DataParetoHorasOperativas"
      titulo="PARETO DE HORAS OPERATIVAS"
    />
  </div>

  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-grafica-pareto
      [data]="DataParetoHorasNoOperativas"
      titulo="PARETO DE HORAS NO OPERATIVAS"
    />
  </div>

  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-grafica-pareto
      [data]="DataParetoHorasMantenimiento"
      titulo="PARETO DE HORAS DE MANTENIMIENTO"
    />
  </div>
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-grafica-pareto
      [data]="DataParetoHorasDemora"
      titulo="PARETO DE HORAS DE DEMORA"
    />
  </div>

  <!-- HORÓMETROS EQUIPO -->
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-horometros-equipo class="block w-full" [data]="dataHorometros">
    </app-horometros-equipo>
  </div>

  <!-- TOTAL HORÓMETROS -->
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-total-horometros class="block w-full" [data]="dataHorometros">
    </app-total-horometros>
  </div>

  <!-- TONELAJE POR EQUIPO -->
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-tonelaje-equipo class="block w-full" [data]="dataToneladasPorEquipo" />
  </div>

  <!-- TN/HR POR EQUIPO -->
  <div
    class="col-span-1 md:col-span-3 xl:col-span-6 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-tn-hr-equipo class="block w-full" [data]="dataTnHrPorEquipo" />
  </div>

  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-resumen-equipos
      class="full-width"
      [data]="dataDetalleEquipo"
      data-page="1"
    ></app-resumen-equipos>
  </div>

  <!-- RANKING OPERADOR -->
  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-mejores-operadores-grafico
      class="block w-full"
      [data]="dataFrPorOperadorTurno"
    >
    </app-mejores-operadores-grafico>
  </div>
  <!-- MEJORES OPERADORES: ancho completo -->
  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-mejores-operadores
      class="block w-full"
      [data]="dataFrPorOperadorTurno"
    >
    </app-mejores-operadores>
  </div>

  <div
    class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
  >
    <app-observaciones
      class="full-width"
      [data]="dataObservaciones"
      data-page="5"
    ></app-observaciones>
    <!-- MAPA DE CALOR -->
    <div
      class="col-span-1 md:col-span-6 xl:col-span-12 min-w-0 rounded-2xl bg-surface p-4 shadow-sm"
    >
      <app-mapa-de-calor
        class="block w-full"
        [data]="dataMapaCalor"
        [turno]="turnoAplicado"
      />
    </div>
  </div>

  <div class="overlay" *ngIf="cargandoPDF">
    <div class="spinner"></div>
    <p>Generando PDF...</p>
  </div>
</div>
