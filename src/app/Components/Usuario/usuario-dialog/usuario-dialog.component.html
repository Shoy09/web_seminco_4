<p-dialog
  [header]="editMode ? 'Editar Usuario' : 'Nuevo Usuario'"
  [modal]="true"
  [(visible)]="dialogVisible"
  (onHide)="onHide()"
  [style]="{ width: '50rem' }"
>
  <form [formGroup]="usuarioForm" class="space-y-5">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink"> DNI </label>
        <input
          pInputText
          type="text"
          formControlName="codigo_dni"
          placeholder="Ingrese DNI"
          class="w-full"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink"> Nombres </label>
        <input
          pInputText
          type="text"
          formControlName="nombres"
          placeholder="Ingrese nombres"
          class="w-full"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink"> Apellidos </label>
        <input
          pInputText
          type="text"
          formControlName="apellidos"
          placeholder="Ingrese apellidos"
          class="w-full"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink"> Cargo </label>
        <p-select
          [options]="cargosDisponibles"
          optionLabel="nombre"
          optionValue="id"
          formControlName="cargo_id"
          placeholder="Seleccione cargo"
          styleClass="w-full"
          appendTo="body"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink"> Rol </label>
        <p-select
          [options]="rolesDisponibles"
          optionLabel="nombre"
          optionValue="id"
          formControlName="rol_id"
          placeholder="Seleccione rol"
          styleClass="w-full"
          appendTo="body"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink"> Procesos </label>
        <p-multiselect
          [options]="procesosDisponibles"
          optionLabel="nombre"
          optionValue="id"
          formControlName="proceso_ids"
          placeholder="Seleccione procesos"
          [maxSelectedLabels]="4"
          styleClass="w-full"
          appendTo="body"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink"> Equipos </label>
        <p-multiselect
          [options]="equiposDisponibles"
          optionLabel="nombre"
          optionValue="id"
          formControlName="equipo_ids"
          placeholder="Seleccione equipos"
          [maxSelectedLabels]="4"
          [filter]="true"
          styleClass="w-full"
          appendTo="body"
        >
          <ng-template pTemplate="option" let-equipo>
            <span>{{ equipo.nombre }} - {{ equipo.modelo }}</span>
          </ng-template>
          <ng-template pTemplate="selectedItems" let-selectedItems>
            @for (item of selectedItems; track item; let last = $last) {
              <span>{{ item.nombre }} - {{ item.modelo }}{{ last ? '' : ', ' }}</span>
            }
          </ng-template>
        </p-multiselect>
      </div>
    </div>

    <div *ngIf="!editMode" class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink"> Contraseña </label>
        <p-password
          formControlName="password"
          placeholder="Ingrese contraseña"
          [toggleMask]="true"
          [feedback]="false"
          styleClass="w-full"
          inputStyleClass="w-full"
        />

        <small
          class="text-danger"
          *ngIf="
            usuarioForm.get('password')?.invalid &&
            usuarioForm.get('password')?.touched
          "
        >
          Debe tener al menos 6 caracteres.
        </small>
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink"> Confirmar Contraseña </label>
        <p-password
          formControlName="confirmPassword"
          placeholder="Repita la contraseña"
          [toggleMask]="true"
          [feedback]="false"
          styleClass="w-full"
          inputStyleClass="w-full"
        />

        <small
          class="text-danger"
          *ngIf="
            usuarioForm.hasError('noCoincide') &&
            usuarioForm.get('confirmPassword')?.touched
          "
        >
          Las contraseñas no coinciden.
        </small>
      </div>
    </div>

    <div class="mt-6 flex justify-end gap-3 border-t border-border pt-5">
      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        severity="danger"
        outlined="true"
        (click)="cancelar()"
      ></button>

      <button
        pButton
        type="button"
        label="Guardar"
        icon="pi pi-save"
        severity="success"
        [disabled]="usuarioForm.invalid"
        (click)="guardar()"
      ></button>
    </div>
  </form>
</p-dialog>
