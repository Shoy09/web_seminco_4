<div class="w-full max-w-3xl rounded-2xl bg-surface p-6 shadow-xl">

  <!-- Header -->
  <div class="mb-6 border-b border-border pb-4">
    <h2 class="text-2xl font-extrabold text-secondary">
      {{ esEdicion ? 'Editar Estado' : 'Crear Estado' }}
    </h2>

    <p class="mt-1 text-sm text-ink-75">
      {{ esEdicion
        ? 'Modifica la información del estado seleccionado.'
        : 'Registra un nuevo estado operativo.' }}
    </p>
  </div>

  <!-- Formulario -->
  <form [formGroup]="estadoForm" (ngSubmit)="guardarCambios()" class="space-y-5">

    <!-- Estado Principal / Código -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">

      <div class="flex flex-col gap-2">
        <label for="codigo" class="text-sm font-bold text-ink">
          Código
        </label>

        <input
          id="codigo"
          pInputText
          type="text"
          formControlName="codigo"
          placeholder="Ingrese código"
          class="w-full"
        />

        <small
          class="text-danger"
          *ngIf="estadoForm.get('codigo')?.invalid && estadoForm.get('codigo')?.touched"
        >
          El código es obligatorio.
        </small>
      </div>

    </div>

    <!-- Tipo Estado / Categoría -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">

      <div class="flex flex-col gap-2">
        <label for="tipo_estado" class="text-sm font-bold text-ink">
          Tipo de Estado
        </label>

        <input
          id="tipo_estado"
          pInputText
          type="text"
          formControlName="tipo_estado"
          placeholder="Ingrese tipo de estado"
          class="w-full"
        />

        <small
          class="text-danger"
          *ngIf="estadoForm.get('tipo_estado')?.invalid && estadoForm.get('tipo_estado')?.touched"
        >
          El tipo de estado es obligatorio.
        </small>
      </div>

      <div class="flex flex-col gap-2">
        <label for="categoria_id" class="text-sm font-bold text-ink">
          Categoría
        </label>

        <p-select
          inputId="categoria_id"
          [options]="categorias"
          formControlName="categoria_id"
          optionLabel="nombre"
          optionValue="id"
          placeholder="Seleccione categoría"
          styleClass="w-full"
          appendTo="body">
        </p-select>

        <small
          class="text-danger"
          *ngIf="estadoForm.get('categoria_id')?.invalid && estadoForm.get('categoria_id')?.touched"
        >
          La categoría es obligatoria.
        </small>
      </div>

    </div>

    <div class="flex flex-col gap-2">
      <label for="proceso_id" class="text-sm font-bold text-ink">
        Proceso
      </label>

      <p-select
        inputId="proceso_id"
        [options]="procesos"
        formControlName="proceso_id"
        optionLabel="nombre"
        optionValue="id"
        placeholder="Seleccione proceso"
        styleClass="w-full"
        appendTo="body">
      </p-select>

      <small
        class="text-danger"
        *ngIf="estadoForm.get('proceso_id')?.invalid && estadoForm.get('proceso_id')?.touched"
      >
        El proceso es obligatorio.
      </small>
    </div>

    <!-- Botones -->
    <div class="mt-6 flex justify-end gap-3 border-t border-border pt-5">

      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        severity="danger"
        outlined="true"
        (click)="cerrar()">
      </button>

      <button
        pButton
        type="submit"
        [label]="esEdicion ? 'Guardar' : 'Crear'"
        icon="pi pi-save"
        severity="success"
        [disabled]="estadoForm.invalid">
      </button>

    </div>

  </form>

</div>
