<div class="space-y-5">
  <section class="rounded-3xl border border-border bg-surface p-6 shadow-sm">
    <div
      class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between"
    >
      <div>
        <h1 class="text-3xl font-black text-secondary">
          Procesos
        </h1>
      </div>

      <button
        pButton
        type="button"
        label="Nuevo proceso"
        icon="pi pi-plus"
        (click)="abrirNuevoProceso()"
      ></button>
    </div>
  </section>

  <section class="rounded-3xl border border-border bg-surface p-5 shadow-sm">
    <div
      class="grid grid-cols-1 gap-4 lg:grid-cols-[1fr_auto_auto] lg:items-end"
    >
      <div class="flex flex-col gap-2">
        <label class="text-sm font-bold text-ink">Buscar proceso</label>
        <input
          pInputText
          type="text"
          [(ngModel)]="busqueda"
          placeholder="Buscar por nombre o nombre abreviado"
          (ngModelChange)="aplicarFiltros()"
        />
      </div>

      <button
        pButton
        type="button"
        label="Aplicar"
        icon="pi pi-filter"
        class="!bg-secondary !border-secondary !text-white hover:!bg-secondary/90"
        (click)="aplicarFiltros()"
      ></button>

      <button
        pButton
        type="button"
        label="Limpiar"
        icon="pi pi-filter-slash"
        severity="secondary"
        [outlined]="true"
        (click)="limpiarFiltros()"
      ></button>
    </div>
  </section>

  <section class="rounded-3xl border border-border bg-surface p-5 shadow-sm">
    <div *ngIf="loading" class="flex min-h-64 items-center justify-center">
      <p-progressSpinner
        strokeWidth="4"
        ariaLabel="Cargando procesos"
      ></p-progressSpinner>
    </div>

    <p-table
      *ngIf="!loading"
      [value]="procesosFiltrados"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[5, 10, 20]"
      responsiveLayout="scroll"
      [tableStyle]="{ 'min-width': '50rem' }"
      styleClass="p-datatable-sm"
    >
      <ng-template pTemplate="header">
        <tr>
          <th class="w-20">ID</th>
          <th>Nombre</th>
          <th>Nombre abreviado</th>
          <th class="text-center">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-proceso>
        <tr>
          <td>{{ proceso.id }}</td>
          <td>{{ proceso.nombre }}</td>
          <td>{{ proceso.nombre_abreviado }}</td>
          <td class="flex gap-2">
            <p-button
              type="button"
              icon="pi pi-pencil"
              severity="info"
              [rounded]="true"
              (click)="editarProceso(proceso)"
            />

            <p-button
              icon="pi pi-trash"
              severity="danger"
              [rounded]="true"
              (click)="eliminarProceso(proceso)"
            />
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="py-12 text-center text-sm text-ink-75">
            No hay procesos registrados.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </section>
</div>

<p-dialog
  [(visible)]="dialogVisible"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="false"
  [style]="{ width: 'min(36rem, 95vw)' }"
  (onHide)="cerrarDialog()"
>
  <ng-template pTemplate="header">
    <div>
      <h2 class="text-xl font-extrabold text-secondary">{{ tituloDialog }}</h2>
      <p class="mt-1 text-sm text-ink-75">
        {{
          editingProcesoId === null
            ? "Registra un nuevo proceso."
            : "Actualiza la informacion del proceso seleccionado."
        }}
      </p>
    </div>
  </ng-template>

  <form class="space-y-4" (ngSubmit)="guardarProceso()">
    <div class="flex flex-col gap-2">
      <label class="text-sm font-bold text-ink">Nombre</label>
      <input
        pInputText
        type="text"
        name="nombre"
        [(ngModel)]="form.nombre"
        placeholder="Ingrese el nombre del proceso"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="text-sm font-bold text-ink">Nombre abreviado</label>
      <input
        pInputText
        type="text"
        name="nombre_abreviado"
        [(ngModel)]="form.nombre_abreviado"
        placeholder="Ingrese el nombre abreviado"
      />
    </div>

    <div class="flex justify-end gap-2 border-t border-border pt-4">
      <button
        pButton
        type="button"
        label="Cancelar"
        severity="secondary"
        [outlined]="true"
        (click)="cerrarDialog()"
      ></button>

      <button
        pButton
        type="submit"
        [label]="editingProcesoId === null ? 'Guardar' : 'Actualizar'"
        icon="pi pi-save"
        [loading]="saving"
      ></button>
    </div>
  </form>
</p-dialog>
