<div class="rounded-2xl border border-border bg-surface p-4 shadow-sm">
  <p-table
    [value]="displayedData"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[5, 10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} - {last} de {totalRecords} registros"
    [tableStyle]="{ 'min-width': '800px' }"
    styleClass="tabla-header-primary p-datatable-sm"
    [rowHover]="true"
  >
    <ng-template pTemplate="caption">
      <div class="flex items-center justify-between">
        <span class="text-lg font-extrabold uppercase tracking-wide text-ink">
          Mejores operadores turno día
        </span>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th class="whitespace-nowrap text-left">Operador</th>
        <th class="whitespace-nowrap text-left">Turno</th>
        <th class="whitespace-nowrap text-right">M/Hr</th>
        <th class="whitespace-nowrap text-right">Metros Perforados</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item>
      <tr>
        <td class="whitespace-nowrap">
          {{ item.operador }}
        </td>

        <td class="whitespace-nowrap">
          {{ item.turno }}
        </td>

        <td class="text-right">
          {{ item.m_hr | number: "1.0-2" }}
        </td>

        <td class="text-right">
          {{ item.metros_perforados | number: "1.0-2" }}
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="py-8 text-center text-sm text-gray-500">
          No hay datos disponibles.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
