<div class="w-full rounded-2xl border border-border bg-surface p-4 shadow-sm">
  <p-table
    [value]="displayedData"
    [paginator]="true"
    [rows]="5"
    [rowsPerPageOptions]="[5, 10, 20, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Mostrando {first} - {last} de {totalRecords} registros"
    responsiveLayout="scroll"
    styleClass="tabla-header-primary rounded-xl overflow-hidden"
  >
    <ng-template pTemplate="caption">
      <div class="flex items-center justify-between gap-3 pb-3">
        <h3 class="m-0 text-base font-bold text-secondary">
          HORA DE PRIMER VIAJE POR EQUIPO
        </h3>
      </div>
    </ng-template>

    <ng-template pTemplate="header">
      <tr>
        <th class="rounded-tl-xl bg-primary px-4 py-3 text-left text-sm font-bold text-white">
          Equipo
        </th>
        <th class="bg-primary px-4 py-3 text-left text-sm font-bold text-white">
          Labor
        </th>
        <th class="bg-primary px-4 py-3 text-left text-sm font-bold text-white">
          Fecha
        </th>
        <th class="bg-primary px-4 py-3 text-left text-sm font-bold text-white">
          Turno
        </th>
        <th class="rounded-tr-xl bg-primary px-4 py-3 text-left text-sm font-bold text-white">
          Hora
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item>
      <tr class="transition-colors hover:bg-primary-25/40">
        <td class="px-4 py-3 text-sm font-medium text-ink">
          {{ item.equipo }}
        </td>
        <td class="px-4 py-3 text-sm text-ink">
          {{ item.labor }}
        </td>
        <td class="px-4 py-3 text-sm text-ink">
          {{ item.fecha }}
        </td>
        <td class="px-4 py-3 text-sm text-ink">
          {{ item.turno }}
        </td>
        <td class="px-4 py-3 text-sm font-bold text-secondary">
          {{ item.hora }}
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="px-4 py-8 text-center text-sm font-medium text-ink-50">
          No hay datos disponibles
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
